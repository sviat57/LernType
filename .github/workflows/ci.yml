name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LernType.sln

      - name: Build
        run: dotnet build LernType.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test LernType.sln -c Release --no-build
